<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Evades.io</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- Форма входа/регистрации -->
    <div id="authContainer" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: flex; justify-content: center; align-items: center; z-index: 1000; flex-direction: column;">
        <div style="background: #1a1a2e; padding: 40px; border-radius: 20px; width: 320px; box-shadow: 0 0 40px rgba(0,0,0,0.8); text-align: center;">
            <h1 style="color: #fff; font-family: Arial; margin-bottom: 30px;">Evades.io</h1>
            <div id="authForm">
                <input type="text" id="usernameInput" placeholder="Username (логин)" style="width: 100%; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #333; background: #2a2a3a; color: #fff; font-size: 16px;" />
                <input type="password" id="passwordInput" placeholder="Password" style="width: 100%; padding: 12px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #333; background: #2a2a3a; color: #fff; font-size: 16px;" />
                <button id="signInBtn" style="width: 100%; padding: 12px; background: #4ecdc4; border: none; border-radius: 8px; color: #fff; font-size: 18px; cursor: pointer; margin-bottom: 10px;">Войти</button>
                <button id="signUpBtn" style="width: 100%; padding: 12px; background: #22193A; border: 1px solid #4ecdc4; border-radius: 8px; color: #fff; font-size: 18px; cursor: pointer;">Зарегистрироваться</button>
                <div id="authMessage" style="color: #ff6b6b; margin-top: 15px; font-size: 14px;"></div>
            </div>
            <div id="authLogout" style="display: none; margin-top: 20px;">
                <p style="color: #aaa;">Вы вошли как <span id="userNameDisplay" style="color: #4ecdc4;"></span></p>
                <button id="logoutBtn" style="padding: 10px 20px; background: #ff4444; border: none; border-radius: 8px; color: #fff; cursor: pointer;">Выйти</button>
            </div>
        </div>
    </div>

    <!-- Меню героев -->
    <div id="heroMenu" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; flex-direction: column; z-index: 100;">
        <h1 style="color: white; font-family: Arial; margin-bottom: 40px;">Выберите героя</h1>
        <div id="heroList"></div>
    </div>

    <canvas id="gameCanvas"></canvas>
    <div id="tooltip"></div>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabaseClient.js"></script>

    <!-- Основные скрипты -->
    <script src="js/utils.js"></script>
    <script src="js/player.js"></script>
    <script src="js/enemy.js"></script>
    <script src="js/enemyLogic.js"></script>
    <script src="js/level.js"></script>
    <script src="js/core/LevelManager.js"></script>
    <script src="js/core/Renderer.js"></script>

    <!-- Герои -->
    <script src="js/heroes/Scutum.js"></script>
    <script src="js/heroes/Sylvanus.js"></script>
    <script src="js/heroes/Crepitus.js"></script>
    <script src="js/heroes/Vortex.js"></script>

    <!-- Карты -->
    <script src="js/maps/BasicCore.js"></script>
    <script src="js/maps/PrimalPeaksMap.js"></script>
    <script src="js/maps/FactoryFortressMap.js"></script>

    <!-- UI и запуск -->
    <script src="js/menu.js"></script>
    <script src="js/ui/Panel.js"></script>
    <script src="js/core/Game.js"></script>

    <script>
        // Логика авторизации
        document.addEventListener('DOMContentLoaded', async () => {
            const authContainer = document.getElementById('authContainer');
            const authForm = document.getElementById('authForm');
            const authLogout = document.getElementById('authLogout');
            const userNameDisplay = document.getElementById('userNameDisplay');
            const authMessage = document.getElementById('authMessage');

            const usernameInput = document.getElementById('usernameInput');
            const passwordInput = document.getElementById('passwordInput');
            const signInBtn = document.getElementById('signInBtn');
            const signUpBtn = document.getElementById('signUpBtn');
            const logoutBtn = document.getElementById('logoutBtn');

            // Проверяем сессию
            const session = await getSession();
            if (session && session.user) {
                authForm.style.display = 'none';
                authLogout.style.display = 'block';
                userNameDisplay.textContent = session.user.email.split('@')[0]; // показываем только имя
                authContainer.style.display = 'none';
                showHeroMenu();
            } else {
                authContainer.style.display = 'flex';
            }

            // Регистрация
            signUpBtn.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                if (!username || !password) {
                    authMessage.textContent = 'Заполните все поля';
                    return;
                }
                if (username.length > 16 || password.length > 16) {
                    authMessage.textContent = 'Максимум 16 символов';
                    return;
                }
                const email = username + '@evades.io';
                const data = await signUp(email, password);
                if (data && data.user) {
                    authMessage.style.color = '#4ecdc4';
                    authMessage.textContent = 'Регистрация успешна! Теперь войдите.';
                } else {
                    authMessage.style.color = '#ff6b6b';
                    authMessage.textContent = 'Ошибка регистрации. Возможно, имя занято.';
                }
            });

            // Вход
            signInBtn.addEventListener('click', async () => {
                const username = usernameInput.value.trim();
                const password = passwordInput.value.trim();
                if (!username || !password) {
                    authMessage.textContent = 'Заполните все поля';
                    return;
                }
                const email = username + '@evades.io';
                const data = await signIn(email, password);
                if (data && data.session) {
                    authMessage.textContent = '';
                    authContainer.style.display = 'none';
                    authForm.style.display = 'none';
                    authLogout.style.display = 'block';
                    userNameDisplay.textContent = username;
                    showHeroMenu();
                } else {
                    authMessage.style.color = '#ff6b6b';
                    authMessage.textContent = 'Неверный логин или пароль';
                }
            });

            // Выход
            logoutBtn.addEventListener('click', async () => {
                await signOut();
                authContainer.style.display = 'flex';
                authForm.style.display = 'block';
                authLogout.style.display = 'none';
                location.reload();
            });
        });
    </script>
</body>
</html>
